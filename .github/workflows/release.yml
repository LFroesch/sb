name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SB_BINARY_NAME: sb
  FOREMAN_BINARY_NAME: sb-foreman
  SB_BUILD_TARGET: .
  FOREMAN_BUILD_TARGET: ./cmd/foreman

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail

          platforms=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for platform in "${platforms[@]}"; do
            read -r os arch <<< "$platform"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi

            sb_out="${SB_BINARY_NAME}-${os}-${arch}${ext}"
            foreman_out="${FOREMAN_BINARY_NAME}-${os}-${arch}${ext}"
            echo "Building $sb_out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "$sb_out" "${SB_BUILD_TARGET}"
            echo "Building $foreman_out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "$foreman_out" "${FOREMAN_BUILD_TARGET}"
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${SB_BINARY_NAME}"-* "${FOREMAN_BINARY_NAME}"-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SB_BINARY_NAME }}-*
            ${{ env.FOREMAN_BINARY_NAME }}-*
            checksums.txt
          generate_release_notes: true
